<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>JET A1 Fuel Calculator</title>
    <style>
        :root {
            --bg: #fff6c7;
            --panel: #fffdf5;
            --panel-alt: #fff8dc;
            --border: #f0d767;
            --accent: #d49d00;
            --accent-deep: #6d4700;
            --text: #2b2200;
            --muted: #5f4a1d;
            --danger: #d32f2f;
            --shadow: rgba(126, 95, 14, 0.18);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: var(--bg);
            font-family: Arial, Helvetica, sans-serif;
            color: var(--text);
        }

        body {
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px;
            overflow: hidden;
        }

        .app {
            width: min(100%, 430px);
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            padding: 6px;
            box-shadow: 0 20px 40px var(--shadow);
        }

        .shell {
            background: var(--panel);
            border: 2px solid var(--border);
            border-radius: 18px;
            padding: 10px 8px 8px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        h1 {
            font-size: clamp(24px, 6vw, 36px);
            color: var(--accent-deep);
            letter-spacing: 1px;
            font-weight: 800;
        }

        .drop {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #ffd669, #f4b900);
            box-shadow: 0 7px 14px rgba(196, 140, 0, 0.2);
        }

        .drop svg {
            width: 18px;
            height: 18px;
        }

        .panel {
            background: var(--panel-alt);
            border: 2px solid var(--border);
            border-radius: 14px;
            padding: 8px;
            margin-bottom: 8px;
        }

        .panel-title {
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .label {
            display: block;
            font-size: 9px;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 4px;
        }

        .density-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .density-row input {
            flex: 1;
            min-width: 0;
            width: 100%;
            padding: 8px 10px;
            font-size: 16px;
            font-weight: 700;
            border: 2px solid #ecd772;
            border-radius: 10px;
            background: #fffdf8;
            color: var(--text);
            outline: none;
        }

        .density-row input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(212, 157, 0, 0.12);
        }

        .tip {
            flex: 0 0 140px;
            background: #fffbe7;
            border-left: 4px solid var(--accent);
            border-radius: 8px;
            padding: 6px 7px;
            font-size: 8px;
            line-height: 1.3;
            color: var(--muted);
        }

        .field-stack {
            display: grid;
            gap: 6px;
        }

        .field {
            background: #fffefc;
            border: 2px solid var(--border);
            border-radius: 10px;
            padding: 6px 8px;
        }

        .field label {
            display: block;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 3px;
        }

        .field input {
            width: 100%;
            border: none;
            background: transparent;
            font-size: 16px;
            font-weight: 700;
            color: var(--text);
            outline: none;
        }

        .field input:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .input-group {
            display: flex;
            gap: 6px;
            align-items: flex-end;
        }

        .input-group .field {
            flex: 1;
        }

        .toggle-btn {
            background: #fffbe7;
            border: 2px solid var(--border);
            border-radius: 10px;
            padding: 6px 8px;
            cursor: pointer;
            font-size: 9px;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            white-space: nowrap;
            height: fit-content;
        }

        .toggle-btn:hover {
            background: #fff8d4;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 10px;
            background: linear-gradient(180deg, #ffdf72, #f5c234);
            color: var(--accent-deep);
            font-size: 14px;
            font-weight: 800;
            padding: 8px 10px;
            cursor: pointer;
            box-shadow: 0 8px 16px rgba(196, 140, 0, 0.18);
            margin-top: 6px;
        }

        .error {
            display: none;
            margin-top: 6px;
            border-left: 4px solid var(--danger);
            background: #ffe9e9;
            color: var(--danger);
            border-radius: 8px;
            padding: 6px 8px;
            font-size: 9px;
        }

        .error.show {
            display: block;
        }

        .formula {
            margin-top: 6px;
            text-align: center;
            font-size: 8px;
            color: var(--muted);
        }

        .divider {
            height: 2px;
            background: var(--border);
            margin: 6px 0;
            border-radius: 1px;
        }

        @media (max-width: 430px) {
            body {
                padding: 4px;
                overflow: hidden;
            }

            .app {
                width: min(100%, 100vw - 8px);
                padding: 4px;
            }

            .shell {
                padding: 8px 6px 6px;
            }

            .density-row {
                flex-direction: column;
                align-items: stretch;
            }

            .input-group {
                flex-direction: column;
                align-items: stretch;
            }

            .toggle-btn {
                width: 100%;
            }

            .tip {
                flex-basis: auto;
                width: 100%;
            }

            .field input, .density-row input {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="shell">
            <div class="header">
                <h1>JET A1</h1>
                <div class="drop" aria-label="Fuel drop icon">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
                        <path d="M12 2s-7 6.5-7 11a7 7 0 0 0 14 0c0-4.5-7-11-7-11z" fill="#000" opacity="0.82"/>
                        <ellipse cx="9.8" cy="8" rx="2.8" ry="1.1" fill="#fff" opacity="0.18"/>
                    </svg>
                </div>
            </div>

            <div class="panel">
                <div class="panel-title">Parameters</div>
                <div class="input-group">
                    <div class="field">
                        <label for="temperature">Temperature (°C)</label>
                        <input type="number" id="temperature" placeholder="-" min="-50" max="50" step="0.1" oninput="updateDensityFromTemp()">
                    </div>
                    <button type="button" class="toggle-btn" onclick="toggleMode()">Switch to Density</button>
                </div>
                <div class="input-group" id="densityInputGroup" style="display: none;">
                    <div class="field">
                        <label for="density">Density (kg/L)</label>
                        <input type="number" id="density" value="0.8" min="0.75" max="0.85" step="0.001" placeholder="0.80" oninput="updateCalculations()">
                    </div>
                    <button type="button" class="toggle-btn" onclick="toggleMode()">Switch to Temp</button>
                </div>
                <div class="tip">Tip: Density varies with temperature. At 0°C it is about 0.807 kg/L, at 20°C about 0.796 kg/L.</div>
            </div>

            <div class="panel">
                <div class="panel-title">Fuel Amounts</div>
                <div class="field-stack">
                    <div class="field">
                        <label for="remainingLbsInput">Remaining Fuel (lbs)</label>
                        <input type="number" id="remainingLbsInput" placeholder="0.00" min="0" step="0.01" oninput="calculateDifference()">
                    </div>

                    <div class="field">
                        <label for="plannedLbsInput">Planned Fuel (lbs)</label>
                        <input type="number" id="plannedLbsInput" placeholder="0.00" min="0" step="0.01" oninput="calculateDifference()">
                    </div>
                </div>
            </div>

            <div class="divider"></div>

            <div class="panel">
                <div class="panel-title">Refueling</div>
                <div class="field-stack">
                    <div class="field">
                        <label for="differenceLbsDisplay">Refueling (lbs)</label>
                        <input type="number" id="differenceLbsDisplay" placeholder="0.00" min="0" step="0.01" readonly>
                    </div>

                    <div class="field">
                        <label for="differenceKgDisplay">Refueling (kg)</label>
                        <input type="number" id="differenceKgDisplay" placeholder="0.00" min="0" step="0.01" readonly>
                    </div>

                    <div class="field">
                        <label for="differenceLitersDisplay">Refueling (L)</label>
                        <input type="number" id="differenceLitersDisplay" placeholder="0.00" min="0" step="0.01" readonly>
                    </div>
                </div>
            </div>

            <button type="button" onclick="resetForm()">Reset</button>

            <div id="errorMsg" class="error"></div>
            <div class="formula">Refueling = Planned - Remaining | kg = lbs / 2.205 | L = kg / Density | Density = 0.8427 - (0.00033 × Temp°C)</div>
        </div>
    </div>

    <script>
        let useTemperatureMode = true;

        function parseNumeric(value) {
            const numericValue = Number(value);
            return Number.isFinite(numericValue) ? numericValue : null;
        }

        function showError(message) {
            const errorElement = document.getElementById('errorMsg');
            errorElement.textContent = message;
            errorElement.classList.add('show');
        }

        function clearError() {
            document.getElementById('errorMsg').classList.remove('show');
        }

        function toggleMode() {
            useTemperatureMode = !useTemperatureMode;
            const temperatureGroup = document.querySelector('.input-group');
            const densityGroup = document.getElementById('densityInputGroup');

            if (useTemperatureMode) {
                temperatureGroup.style.display = 'flex';
                densityGroup.style.display = 'none';
                document.getElementById('temperature').focus();
            } else {
                temperatureGroup.style.display = 'none';
                densityGroup.style.display = 'flex';
                document.getElementById('density').focus();
            }
        }

        function calculateDensityFromTemp(tempCelsius) {
            // Linear approximation: Density = 0.8427 - (0.00033 × Temperature in °C)
            const density = 0.8427 - (0.00033 * tempCelsius);
            return density;
        }

        function calculateTempFromDensity(density) {
            // Reverse calculation: Temperature = (0.8427 - Density) / 0.00033
            const temp = (0.8427 - density) / 0.00033;
            return temp;
        }

        function updateDensityFromTemp() {
            const tempInput = document.getElementById('temperature').value.trim();
            const densityDisplay = document.getElementById('density');

            if (tempInput === '') {
                densityDisplay.value = '';
                clearError();
                return;
            }

            const temp = parseNumeric(tempInput);
            if (temp === null || temp < -50 || temp > 50) {
                clearError();
                return;
            }

            const calculatedDensity = calculateDensityFromTemp(temp);
            densityDisplay.value = calculatedDensity.toFixed(3);
            calculateDifference();
        }

        function updateTempFromDensity() {
            const densityInput = document.getElementById('density').value.trim();
            const tempDisplay = document.getElementById('temperature');

            if (densityInput === '') {
                tempDisplay.value = '';
                clearError();
                return;
            }

            const density = parseNumeric(densityInput);
            if (density === null || density < 0.75 || density > 0.85) {
                return;
            }

            const calculatedTemp = calculateTempFromDensity(density);
            tempDisplay.value = calculatedTemp.toFixed(1);
        }

        function getDensity() {
            const densityInput = document.getElementById('density').value.trim();
            
            if (densityInput === '') {
                if (useTemperatureMode) {
                    showError('Please enter a temperature.');
                } else {
                    showError('Please enter a density.');
                }
                return null;
            }

            const density = parseNumeric(densityInput);

            if (density === null || density < 0.75 || density > 0.85) {
                showError('Density must be between 0.75 and 0.85 kg/L.');
                return null;
            }

            return density;
        }

        function calculateDifference() {
            const remainingInput = document.getElementById('remainingLbsInput').value.trim();
            const plannedInput = document.getElementById('plannedLbsInput').value.trim();
            
            // Only proceed if BOTH fields have values
            if (remainingInput === '' || plannedInput === '') {
                document.getElementById('differenceLbsDisplay').value = '';
                document.getElementById('differenceKgDisplay').value = '';
                document.getElementById('differenceLitersDisplay').value = '';
                clearError();
                return;
            }

            const remainingLbs = parseNumeric(remainingInput);
            const plannedLbs = parseNumeric(plannedInput);

            // Check if values are valid numbers and non-negative
            if (remainingLbs === null || plannedLbs === null || remainingLbs < 0 || plannedLbs < 0) {
                document.getElementById('differenceLbsDisplay').value = '';
                document.getElementById('differenceKgDisplay').value = '';
                document.getElementById('differenceLitersDisplay').value = '';
                clearError();
                return;
            }

            const density = getDensity();
            if (density === null) {
                document.getElementById('differenceLbsDisplay').value = '';
                document.getElementById('differenceKgDisplay').value = '';
                document.getElementById('differenceLitersDisplay').value = '';
                return;
            }

            // Calculate difference
            const differenceLbs = plannedLbs - remainingLbs;
            const differenceKg = differenceLbs / 2.205;
            const differenceLiters = differenceKg / density;

            document.getElementById('differenceLbsDisplay').value = differenceLbs.toFixed(2);
            document.getElementById('differenceKgDisplay').value = differenceKg.toFixed(2);
            document.getElementById('differenceLitersDisplay').value = differenceLiters.toFixed(2);
            clearError();
        }

        function updateCalculations() {
            if (!useTemperatureMode) {
                updateTempFromDensity();
            }
            calculateDifference();
        }

        function resetForm() {
            document.getElementById('temperature').value = '';
            document.getElementById('density').value = '0.8';
            document.getElementById('remainingLbsInput').value = '';
            document.getElementById('plannedLbsInput').value = '';
            document.getElementById('differenceLbsDisplay').value = '';
            document.getElementById('differenceKgDisplay').value = '';
            document.getElementById('differenceLitersDisplay').value = '';
            clearError();
            useTemperatureMode = true;
            document.querySelector('.input-group').style.display = 'flex';
            document.getElementById('densityInputGroup').style.display = 'none';
        }
    </script>
</body>
</html>
